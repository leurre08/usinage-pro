name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter project
        run: |
          cd ..
          flutter create usinage_pro_temp
          cp -r usinage-pro/* usinage_pro_temp/
          cd usinage_pro_temp
          flutter pub get

      - name: Build APK
        run: |
          cd ..
          cd usinage_pro_temp
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: usinage-pro-apk
          path: ../usinage_pro_temp/build/app/outputs/flutter-apk/app-release.apk
